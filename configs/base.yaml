# ===========================================================
# base.yaml  â€”  Full development / evaluation configuration
# ===========================================================
# This is the primary configuration for local development,
# model comparison, and final evaluation runs.

data:
  path: "credit_card_customers_v1.csv"
  target_column: "High_Risk_Customer"
  id_column: "Customer_ID"
  test_size: 0.2
  versions:
    v1: "credit_card_customers_v1.csv"
    v2: "credit_card_customers_v2.csv"

random_seed: 42
random_seeds: [42, 123, 456]

features:
  utilization_threshold: 0.8       # Balance / Credit_Limit above this â†’ high utilization flag
  late_payment_threshold: 5        # Payment_Delay_Days above this â†’ late payer flag

model:
  baseline: "LogisticRegression"
  candidates:
    - name: "RandomForest"
      params:
        n_estimators: [50, 100, 200]
        max_depth: [3, 5, 10]
    - name: "GradientBoosting"
      params:
        n_estimators: [50, 100, 200]
        learning_rate: [0.01, 0.05, 0.1]
  cv_folds: 5

tracking:
  experiment_name: "credit-risk"
  tracking_uri: "sqlite:///mlflow.db"

quality_gate:
  metric: "f1"
  threshold: 0.60                  # PROVISIONAL â€” will be evaluated in Task 8
  baseline_file: "baseline.json"

